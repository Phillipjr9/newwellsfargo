name: check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Ledger and API tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser flows
        run: |
          npx playwright install --with-deps chromium
          bash tests/run-shots.sh tests/home-routing.browser.cjs
          bash tests/run-shots.sh tests/preview-cookie.browser.cjs
          bash tests/run-shots.sh tests/portal.browser.cjs
          npm run test:interactions
          npm run test:public
          npm run catalog:audit
          npm run test:deposit
          npm run test:admin
